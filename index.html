<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Keycap RNG</title>
<style>
:root{
  --bg1:#0d0f16; --bg2:#151826; --panel:#12141e; --panel2:#1a1d2b;
  --text:#e8eaf2; --text-dim:#9aa0b4; --accent:#7c9cff; --accent2:#ffb347;
  --border:rgba(255,255,255,.08); --good:#5fd67a; --bad:#ff5e6e;
  --r-comun:#b8bec8; --r-pocoComun:#5fd67a; --r-raro:#4aa3ff; --r-epico:#b465ff;
  --r-legendario:#ffb347; --r-mitico:#ff5e9e; --r-omega:#00e5ff; --r-prohibido:#ff2b3f;
  --r-secreto:#c65bff; --r-divino:#ffd700;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(circle at 20% 0%, var(--bg2), var(--bg1) 60%);
  color:var(--text); overflow-x:hidden; min-height:100%;
}
body.bg-aurora{background:radial-gradient(circle at 30% 10%,#1c2a4a,#0d0f16 65%),linear-gradient(120deg,#0d0f16,#131c33);}
body.bg-neon{background:radial-gradient(circle at 70% 0%,#2a0f3a,#0a0a12 60%);}
body.bg-espacio{background:
  radial-gradient(2px 2px at 10% 20%, #fff, transparent),
  radial-gradient(1px 1px at 80% 40%, #fff, transparent),
  radial-gradient(1.5px 1.5px at 50% 80%, #fff, transparent),
  radial-gradient(1px 1px at 30% 60%, #fff, transparent),
  radial-gradient(circle at 50% 20%, #1a1440, #05050a 70%);}
body.bg-dorado{background:radial-gradient(circle at 50% -10%, #3a2a10, #0d0f16 65%);}
body.bg-arcano{background:radial-gradient(circle at 20% 100%, #2a0a3a, #0d0f16 60%),radial-gradient(circle at 80% 0%, #0a1a3a, transparent 60%);}

#app{max-width:1400px;margin:0 auto;padding:16px 16px 40px;}
#topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:linear-gradient(180deg, var(--panel2), var(--panel));
  border:1px solid var(--border); border-radius:14px; padding:12px 18px; margin-bottom:16px;
  flex-wrap:wrap;
}
#topbar h1{font-size:1.15rem; margin:0; letter-spacing:.5px; display:flex; gap:8px; align-items:center;}
#coin-display{
  font-size:1.3rem; font-weight:700; color:var(--accent2); display:flex; gap:8px; align-items:center;
  background:rgba(255,179,71,.08); padding:6px 14px; border-radius:10px; border:1px solid rgba(255,179,71,.25);
}
#coin-display .coin-icon{filter:drop-shadow(0 0 4px rgba(255,179,71,.6));}
.icon-btn{
  background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:10px;
  padding:8px 12px; cursor:pointer; font-size:1rem; transition:.15s;
}
.icon-btn:hover{background:#232741; border-color:var(--accent);}

#main-layout{display:grid; grid-template-columns: 1fr 400px; gap:16px; align-items:start;}
@media(max-width:980px){#main-layout{grid-template-columns:1fr;}}

#keyboard-wrap{
  background:linear-gradient(180deg,#181c2c,#0f1119);
  border:1px solid var(--border); border-radius:18px; padding:22px; position:relative; overflow:hidden;
  box-shadow: inset 0 0 60px rgba(0,0,0,.4);
}
#keyboard{display:flex; flex-direction:column; gap:8px; align-items:center;}
.kb-row{display:flex; gap:6px; justify-content:center;}

.key{
  --u: clamp(30px, 4.4vw, 46px);
  width:calc(var(--u) * var(--w, 1) + (var(--w,1) - 1) * 6px);
  height:var(--u);
  border-radius:8px;
  position:relative;
  background: linear-gradient(160deg, var(--kt,#3a3f4b), var(--kb,#20232d));
  box-shadow: 0 4px 0 var(--ks,#14161b), 0 6px 12px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.07);
  display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--u) * .3);
  font-weight:600; color:#dfe3f0; user-select:none; cursor:pointer;
  transition:transform .05s ease, box-shadow .05s ease, filter .2s;
  flex-shrink:0;
}
.key .emoji{font-size:calc(var(--u)*.42); line-height:1;}
.key.pressed{
  transform:translateY(4px);
  box-shadow: 0 1px 0 var(--ks,#14161b), 0 2px 5px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.14);
}
.key.locked{ filter:grayscale(1) brightness(.55); cursor:not-allowed; }
.key.locked::after{
  content:'🔒'; position:absolute; top:2px; right:3px; font-size:calc(var(--u)*.28); opacity:.85;
}
.key.locked .cost-tag{
  position:absolute; bottom:-2px; font-size:calc(var(--u)*.2); color:#ffd27a; background:rgba(0,0,0,.55);
  padding:0 4px; border-radius:5px; white-space:nowrap; left:50%; transform:translateX(-50%);
}
.key.affordable{ animation:affordPulse 1.6s ease-in-out infinite; }
@keyframes affordPulse{
  0%,100%{ box-shadow: 0 4px 0 var(--ks,#14161b), 0 6px 12px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.14), 0 0 0 rgba(255,215,0,0);}
  50%{ box-shadow: 0 4px 0 var(--ks,#14161b), 0 6px 16px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.14), 0 0 14px 2px rgba(255,215,0,.55);}
}
.key.favorite::before{
  content:'⭐'; position:absolute; top:-6px; left:-4px; font-size:calc(var(--u)*.26); filter:drop-shadow(0 0 2px #000);
}
.key[data-rarity="pocoComun"], .key[data-rarity="raro"], .key[data-rarity="epico"],
.key[data-rarity="legendario"], .key[data-rarity="mitico"], .key[data-rarity="omega"],
.key[data-rarity="prohibido"], .key[data-rarity="secreto"], .key[data-rarity="divino"]{
  animation: glowPulse 2.4s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{ box-shadow: 0 4px 0 var(--ks), 0 6px 12px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.16), 0 0 6px 0 var(--glow, transparent); }
  50%{ box-shadow: 0 4px 0 var(--ks), 0 8px 18px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.16), 0 0 18px 3px var(--glow, transparent); }
}

#particles-layer{position:fixed; inset:0; pointer-events:none; z-index:9990; overflow:hidden;}
.particle{position:absolute; pointer-events:none; will-change:transform,opacity;}

body.shaking #app{animation: screenShake .5s ease;}
@keyframes screenShake{
  0%,100%{transform:translate(0,0);} 10%{transform:translate(-6px,3px);} 20%{transform:translate(6px,-3px);}
  30%{transform:translate(-5px,4px);} 40%{transform:translate(5px,-4px);} 50%{transform:translate(-4px,2px);}
  60%{transform:translate(4px,-2px);} 70%{transform:translate(-3px,2px);} 80%{transform:translate(3px,-1px);} 90%{transform:translate(-1px,1px);}
}

#panel{
  background:linear-gradient(180deg, var(--panel2), var(--panel));
  border:1px solid var(--border); border-radius:16px; overflow:hidden; display:flex; flex-direction:column;
  max-height:80vh;
}
#tabs{display:flex; flex-wrap:wrap; border-bottom:1px solid var(--border); background:rgba(0,0,0,.15);}
.tab-btn{
  flex:1 1 auto; background:none; border:none; color:var(--text-dim); padding:10px 6px; font-size:.78rem;
  cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
}
.tab-btn.active{color:var(--text); border-bottom-color:var(--accent); background:rgba(124,156,255,.08);}
#panel-content{padding:14px; overflow-y:auto; flex:1;}
#panel-content::-webkit-scrollbar{width:8px;}
#panel-content::-webkit-scrollbar-thumb{background:#333850; border-radius:4px;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

h3.section-title{margin:0 0 10px; font-size:.95rem; color:var(--accent); display:flex; align-items:center; gap:6px;}
.sub{color:var(--text-dim); font-size:.78rem; margin:2px 0 10px;}

/* Gacha */
#reel-container{
  width:100%; height:100px; overflow:hidden; position:relative; background:#0a0b12; border-radius:12px;
  border:1px solid var(--border); margin-bottom:12px;
}
#reel-marker{position:absolute; left:50%; top:0; bottom:0; width:2px; background:var(--accent2); z-index:2; box-shadow:0 0 8px var(--accent2);}
#reel-strip{position:absolute; top:0; left:0; height:100%; display:flex; align-items:center; gap:8px; padding:0 8px;
  transition:none;}
.reel-card{
  width:84px; height:84px; flex-shrink:0; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#242844,#14162200); border:2px solid var(--r-comun); gap:2px;
}
.reel-card .e{font-size:2rem;}
.reel-card .n{font-size:.55rem; color:var(--text-dim); text-align:center; padding:0 3px;}
#roll-btn{
  width:100%; padding:14px; font-size:1rem; font-weight:700; border:none; border-radius:12px; cursor:pointer;
  background:linear-gradient(135deg, var(--accent), #5a6fd8); color:#fff; box-shadow:0 4px 14px rgba(124,156,255,.35);
  transition:.15s;
}
#roll-btn:hover{filter:brightness(1.1);}
#roll-btn:disabled{opacity:.5; cursor:not-allowed;}
.roll-cost{text-align:center; font-size:.8rem; color:var(--text-dim); margin-top:6px;}
.rarity-table{width:100%; border-collapse:collapse; margin-top:14px; font-size:.72rem;}
.rarity-table td,.rarity-table th{padding:4px 6px; border-bottom:1px solid var(--border); text-align:left;}
.rarity-chip{display:inline-block; padding:1px 8px; border-radius:20px; font-weight:700; font-size:.68rem;}

/* Shop */
.shop-section{margin-bottom:18px;}
.shop-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 10px; margin-bottom:6px;
  background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:10px; font-size:.82rem;
}
.shop-item .info{flex:1;}
.shop-item .info b{display:block; font-size:.86rem;}
.shop-item .info span{color:var(--text-dim); font-size:.72rem;}
.buy-btn{
  background:var(--accent); border:none; color:#fff; padding:7px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:.76rem;
  white-space:nowrap;
}
.buy-btn:disabled{background:#444; cursor:not-allowed; opacity:.6;}
.buy-btn.owned{background:var(--good);}

/* Inventory / Collection */
.toolbar{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
.toolbar input, .toolbar select{
  background:#0e0f18; border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:8px; font-size:.76rem;
}
.toolbar input{flex:1; min-width:100px;}
.style-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px;}
.style-card{
  aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#242844,#181a28); border:2px solid var(--c,var(--r-comun)); position:relative; padding:4px; cursor:pointer;
  gap:2px;
}
.style-card .e{font-size:1.6rem;}
.style-card .n{font-size:.58rem; text-align:center; color:var(--text-dim); line-height:1.1;}
.style-card .fav-star{position:absolute; top:2px; right:3px; font-size:.7rem;}
.style-card.locked{filter:brightness(.35) grayscale(1);}
.style-card.locked .n{color:#666;}
.style-card .count-badge{position:absolute; bottom:2px; right:3px; font-size:.55rem; background:rgba(0,0,0,.6); padding:0 4px; border-radius:6px;}

/* Missions/Achievements */
.mission-item, .ach-item{
  background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px;
}
.mission-item.done, .ach-item.done{border-color:var(--good);}
.progress-bar{height:8px; background:#181a28; border-radius:6px; overflow:hidden; margin-top:6px;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--good)); transition:width .3s;}
.claim-btn{margin-top:6px; width:100%; background:var(--good); border:none; color:#08260f; font-weight:700; padding:6px; border-radius:8px; cursor:pointer;}
.claim-btn:disabled{background:#333; color:#888; cursor:not-allowed;}

/* Stats */
.stat-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:.85rem;}
.stat-row b{color:var(--accent2);}

/* Modal */
#modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center;
  z-index:9999; opacity:0; pointer-events:none; transition:opacity .18s;
}
#modal-overlay.show{opacity:1; pointer-events:all;}
.modal{
  background:linear-gradient(180deg,#1b1e2e,#12141e); border:1px solid var(--border); border-radius:16px; padding:20px;
  width:min(92vw, 420px); max-height:85vh; overflow-y:auto; display:none; transform:scale(.92); transition:transform .18s;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
#modal-overlay.show .modal.active{display:block; transform:scale(1);}
.modal h2{margin:0 0 12px; font-size:1.05rem; display:flex; align-items:center; gap:8px;}
.modal-close{position:absolute; top:14px; right:16px; background:none; border:none; color:var(--text-dim); font-size:1.2rem; cursor:pointer;}
.menu-btn{
  display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; margin-bottom:6px; background:rgba(255,255,255,.04);
  border:1px solid var(--border); color:var(--text); border-radius:10px; cursor:pointer; font-size:.88rem; text-align:left;
}
.menu-btn:hover{background:rgba(124,156,255,.12); border-color:var(--accent);}
.menu-btn.danger:hover{background:rgba(255,94,110,.15); border-color:var(--bad);}

#reveal-card{ text-align:center; padding:20px 0; }
#reveal-emoji{font-size:5rem; display:block; margin-bottom:8px; filter:drop-shadow(0 0 18px var(--glow, #fff));}
#reveal-name{font-size:1.3rem; font-weight:800; margin-bottom:4px;}
#reveal-rarity{font-weight:700; margin-bottom:10px; display:inline-block; padding:3px 14px; border-radius:20px;}
#reveal-stats{color:var(--text-dim); font-size:.85rem; line-height:1.6;}
.reveal-glow{
  position:absolute; inset:0; border-radius:16px; pointer-events:none;
  background:radial-gradient(circle at 50% 30%, var(--glow, transparent), transparent 70%); opacity:.35;
}

#toast-container{position:fixed; top:16px; right:16px; z-index:10000; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
.toast{
  background:#1b1e2e; border:1px solid var(--border); border-left:4px solid var(--accent); color:var(--text); padding:10px 16px;
  border-radius:10px; font-size:.82rem; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:toastIn .25s ease, toastOut .3s ease 3.2s forwards;
  max-width:320px;
}
.toast.gold{border-left-color:var(--accent2);}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
@keyframes toastOut{to{opacity:0; transform:translateX(30px);}}

.hidden{display:none !important;}
.bg-swatch{width:36px; height:24px; border-radius:6px; border:2px solid var(--border); cursor:pointer; display:inline-block;}
.bg-swatch.active{border-color:var(--accent2);}
::selection{background:var(--accent);}
</style>
</head>
<body>
<div id="particles-layer"></div>
<div id="app">
  <header id="topbar">
    <h1>⌨️ Keycap RNG</h1>
    <div id="coin-display"><span class="coin-icon">🪙</span><span id="coin-amount">0</span></div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" id="mute-btn" title="Silenciar sonido">🔊</button>
    </div>
  </header>

  <main id="main-layout">
    <section id="keyboard-wrap">
      <div id="keyboard"></div>
    </section>

    <aside id="panel">
      <nav id="tabs">
        <button class="tab-btn active" data-tab="gacha">🎰 Ruleta</button>
        <button class="tab-btn" data-tab="shop">🛒 Tienda</button>
        <button class="tab-btn" data-tab="inventory">🎒 Inventario</button>
        <button class="tab-btn" data-tab="collection">📖 Colección</button>
        <button class="tab-btn" data-tab="missions">🎯 Misiones</button>
        <button class="tab-btn" data-tab="achievements">🏆 Logros</button>
        <button class="tab-btn" data-tab="stats">📊 Stats</button>
      </nav>
      <div id="panel-content">
        <div class="tab-pane active" id="tab-gacha">
          <h3 class="section-title">🎰 Ruleta de Estilos</h3>
          <p class="sub">Gasta monedas por una oportunidad de conseguir un nuevo Keycap. ¡Una tirada más...!</p>
          <div id="reel-container"><div id="reel-marker"></div><div id="reel-strip"></div></div>
          <button id="roll-btn">TIRAR</button>
          <div class="roll-cost" id="roll-cost-label"></div>
          <table class="rarity-table" id="rarity-table"></table>
        </div>
        <div class="tab-pane" id="tab-shop"></div>
        <div class="tab-pane" id="tab-inventory">
          <div class="toolbar">
            <input type="text" id="inv-search" placeholder="Buscar estilo...">
            <select id="inv-sort">
              <option value="rarity">Rareza</option>
              <option value="name">Nombre</option>
              <option value="coins">Monedas</option>
              <option value="date">Fecha</option>
              <option value="prob">Probabilidad</option>
            </select>
          </div>
          <div class="toolbar">
            <select id="inv-filter">
              <option value="all">Todas las rarezas</option>
            </select>
            <label style="display:flex;align-items:center;gap:4px;font-size:.76rem;"><input type="checkbox" id="inv-fav-only"> ★ favoritos</label>
          </div>
          <div class="style-grid" id="inventory-grid"></div>
        </div>
        <div class="tab-pane" id="tab-collection">
          <div class="sub" id="collection-progress"></div>
          <div class="toolbar">
            <select id="col-filter"><option value="all">Todas las rarezas</option></select>
          </div>
          <div class="style-grid" id="collection-grid"></div>
        </div>
        <div class="tab-pane" id="tab-missions"><h3 class="section-title">🎯 Misiones</h3><div id="missions-list"></div></div>
        <div class="tab-pane" id="tab-achievements"><h3 class="section-title">🏆 Logros</h3><div id="achievements-list"></div></div>
        <div class="tab-pane" id="tab-stats"><h3 class="section-title">📊 Estadísticas</h3><div id="stats-list"></div></div>
      </div>
    </aside>
  </main>
</div>

<div id="modal-overlay">
  <div class="modal" id="modal-key-menu" style="position:relative;">
    <button class="modal-close" data-close>✕</button>
    <h2 id="km-title">Tecla</h2>
    <button class="menu-btn" id="km-change-style">🎨 Cambiar estilo</button>
    <button class="menu-btn" id="km-sell">💰 Vender tecla</button>
    <button class="menu-btn" id="km-stats">📊 Ver estadísticas</button>
    <button class="menu-btn" id="km-fav">⭐ Añadir a favoritos</button>
  </div>

  <div class="modal" id="modal-style-picker" style="position:relative;">
    <button class="modal-close" data-close>✕</button>
    <h2>🎨 Elegir estilo</h2>
    <div class="toolbar"><input type="text" id="picker-search" placeholder="Buscar..."></div>
    <div class="style-grid" id="picker-grid"></div>
  </div>

  <div class="modal" id="modal-key-stats" style="position:relative;">
    <button class="modal-close" data-close>✕</button>
    <h2 id="ks-title">Estadísticas</h2>
    <div id="ks-body"></div>
  </div>

  <div class="modal" id="modal-reveal" style="position:relative;">
    <button class="modal-close" data-close>✕</button>
    <div class="reveal-glow" id="reveal-glow"></div>
    <div id="reveal-card">
      <span id="reveal-emoji">✨</span>
      <div id="reveal-name">???</div>
      <span id="reveal-rarity">Común</span>
      <div id="reveal-stats"></div>
    </div>
  </div>

  <div class="modal" id="modal-confirm" style="position:relative;">
    <button class="modal-close" data-close>✕</button>
    <h2 id="confirm-title">¿Confirmar?</h2>
    <p id="confirm-body" class="sub"></p>
    <button class="menu-btn danger" id="confirm-yes">Sí, confirmar</button>
    <button class="menu-btn" data-close>Cancelar</button>
  </div>
</div>

<div id="toast-container"></div>

<script>
(function(){
"use strict";

/* ============================= DATA ============================= */

const THEMES = [
['☁️','Nubes'],['🔥','Fuego'],['❄️','Hielo'],['⚡','Rayos'],['🌸','Sakura'],
['🌌','Galaxia'],['🌊','Océano'],['💎','Cristal'],['🌈','Arcoíris'],['🌿','Naturaleza'],
['🌋','Lava'],['⚙️','Mecánico'],['☢️','Nuclear'],['👻','Fantasma'],['🌙','Luna'],
['⭐','Estrellas'],['🪐','Planetas'],['☀️','Sol'],['🐉','Dragón'],['⚫','Vacío'],
['🌪️','Tornado'],['⛈️','Tormenta'],['🏜️','Desierto'],['🌴','Selva'],['🗻','Volcán'],
['🌅','Aurora'],['🌨️','Nieve'],['🌧️','Lluvia'],['🍂','Otoño'],['🌲','Bosque'],

function buildStyles(){
  const styles = [];
  const usedNames = new Set();
  RARITIES.forEach(rar=>{
    for(let i=0;i<rar.count;i++){
      const t = i % THEMES.length;
      const variant = Math.floor(i / THEMES.length);
      const [emoji, base] = THEMES[t];
      let name = base;
      if(variant>0){
        const suf = VARIANT_SUFFIX[rar.id][(variant-1) % VARIANT_SUFFIX[rar.id].length];
        name = base + ' ' + suf;
      }
      let uniqueName = name;
      let dupN = 1;
      while(usedNames.has(uniqueName+'|'+rar.id)){ dupN++; uniqueName = name+' '+dupN; }
      usedNames.add(uniqueName+'|'+rar.id);
      const frac = rar.count<=1 ? 0 : i/(rar.count-1);
      const prob = Math.max(2, Math.round(rar.probMin * Math.pow(rar.probMax/rar.probMin, frac)));
      const coins = Math.max(1, Math.round(rar.coinMin + (rar.coinMax-rar.coinMin)*frac));
      styles.push({
        id: rar.id+'_'+i, name:uniqueName, emoji, rarity:rar.id, prob, coins,
      });
    }
  });
  ICONIC.forEach((ic,idx)=>{
    const [emoji] = THEMES[ic.themeIdx];
    styles.push({id:'iconic_'+idx, name:ic.name, emoji, rarity:ic.rarity, prob:ic.prob, coins:ic.coins, iconic:true});
  });
  return styles;
}

/* ============================= GACHA ============================= */

function rollStyle(){
  const lf = luckFactor();
  let total = 0;
  const weights = STYLES.map(s=>{
    const w = (1/s.prob) * (s.rarity==='comun' ? 1 : lf);
    total += w;
    return w;
  });
  let r = Math.random()*total;
  for(let i=0;i<STYLES.length;i++){
    r -= weights[i];
    if(r<=0) return STYLES[i];
  }
  return STYLES[STYLES.length-1];
}

function markObtained(style){
  const existing = state.styles[style.id];
  if(!existing){
    state.styles[style.id] = { owned:true, timesObtained:1, firstObtainedAt: Date.now() };
  } else {
    existing.owned = true;
    existing.timesObtained = (existing.timesObtained||0)+1;
  }
}

let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }

function playClick(){
  if(state.soundMuted) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type='square'; osc.frequency.setValueAtTime(140+Math.random()*40, t);
  gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.06);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.07);
}
function playReveal(rarityIdx){
  if(state.soundMuted) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const t = ctx.currentTime;
  const notes = rarityIdx<=2 ? [523] : rarityIdx<=5 ? [523,659,784] : [392,523,659,784,988];
  notes.forEach((f,i)=>{
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = rarityIdx>=7?'sawtooth':'sine';
    osc.frequency.setValueAtTime(f, t+i*0.09);
    gain.gain.setValueAtTime(0.0001, t+i*0.09);
    gain.gain.exponentialRampToValueAtTime(0.12, t+i*0.09+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+i*0.09+0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t+i*0.09); osc.stop(t+i*0.09+0.4);
  });
}

function classifyParticle(name, rarityColorHex){
  for(const cat of PARTICLE_CATEGORIES){
    if(cat.kw.some(k=>name.indexOf(k)!==-1)) return cat;
  }
  return {color:rarityColorHex, shape:'●', motion:'burst'};
}

function spawnParticles(x, y, style){
  const cat = classifyParticle(style.name, rarityColor(style.rarity));
  const layer = document.getElementById('particles-layer');
  const n = 6;
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = cat.shape;
    p.style.left = x+'px'; p.style.top = y+'px';
    p.style.color = cat.color;
    p.style.fontSize = (10+Math.random()*10)+'px';
    p.style.textShadow = '0 0 6px '+cat.color;
    layer.appendChild(p);
    const angle = (Math.random()*Math.PI*2);
    const dist = 30+Math.random()*40;
    let dx, dy;
    if(cat.motion==='rise'){ dx=(Math.random()-0.5)*40; dy=-(50+Math.random()*40); }
    else if(cat.motion==='fall'){ dx=(Math.random()-0.5)*40; dy=(50+Math.random()*40); }
    else if(cat.motion==='orbit'){ dx=Math.cos(angle)*dist; dy=Math.sin(angle)*dist-20; }
    else { dx=Math.cos(angle)*dist; dy=Math.sin(angle)*dist; }
    const dur = 500+Math.random()*400;
    p.animate([
      {transform:'translate(0,0) scale(1) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(.3) rotate(${Math.random()*180-90}deg)`, opacity:0}
    ], {duration:dur, easing:'ease-out'});
    setTimeout(()=>p.remove(), dur+50);
  }
}

    el.removeAttribute('data-rarity');
    const cost = keyCost(code);
    el.classList.toggle('affordable', state.coins>=cost);
    return;
  }
  el.classList.remove('affordable');
  const style = getStyle(k.styleId) || DEFAULT_STYLE;
  const color = rarityColor(style.rarity);
  el.setAttribute('data-rarity', style.rarity);
  el.style.setProperty('--glow', color);
  if(style.isDefault){
    el.style.setProperty('--kt', '#3a3f4b'); el.style.setProperty('--kb', '#20232d'); el.style.setProperty('--ks', '#14161b');
  } else {
    el.style.setProperty('--kt', shade(color, 18));
    el.style.setProperty('--kb', shade(color, -35));
    el.style.setProperty('--ks', shade(color, -60));
  }
}
function shade(hex, pct){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r = Math.min(255,Math.max(0, r+ (pct/100)*255));
  g = Math.min(255,Math.max(0, g+ (pct/100)*255));
  b = Math.min(255,Math.max(0, b+ (pct/100)*255));
  return `rgb(${r|0},${g|0},${b|0})`;
}

/* ============================= INPUT HANDLING ============================= */

function isTypingTarget(el){
  return el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.isContentEditable);
}

window.addEventListener('keydown', e=>{
  if(isTypingTarget(document.activeElement)) return;
  const code = e.code;
  if(!(code in state.keys)) return;
  if(['Space','Tab','Backspace'].includes(code)) e.preventDefault();
  const el = keyElements[code];
  if(el) el.classList.add('pressed');
  if(e.repeat) return;
  const k = state.keys[code];
  if(!k.unlocked) return;
  const style = getStyle(k.styleId) || DEFAULT_STYLE;
  const gain = Math.max(1, Math.round(style.coins * coinMultiplier()));
  state.coins += gain; state.totalCoinsEarned += gain; state.totalPresses++;
  k.presses++; k.coinsGenerated += gain;
  playClick();
  if(el){
    const rect = el.getBoundingClientRect();
    spawnParticles(rect.left+rect.width/2, rect.top+rect.height/2, style);
  }
  updateCoinDisplay();
  checkMissions(); checkAchievements();
  scheduleUIRefresh();
});
window.addEventListener('keyup', e=>{
  const el = keyElements[e.code]; if(el) el.classList.remove('pressed');
});

let refreshTimer = null;
function scheduleUIRefresh(){
  if(refreshTimer) return;
  refreshTimer = setTimeout(()=>{ refreshTimer=null; refreshShopAffordability(); refreshMissionsAchievements(); refreshStats(); }, 400);
}

function formatNum(n){
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return n.toLocaleString('es-ES');
  return String(n);
}

function animateReel(result, cb){
  const strip = document.getElementById('reel-strip');
  strip.innerHTML=''; strip.style.transition='none'; strip.style.transform='translateX(0)';
  const cardW = 92;
  const N = 28;
  for(let i=0;i<N;i++){
    const s = STYLES[Math.floor(Math.random()*STYLES.length)];
    strip.appendChild(makeReelCard(s));
  }
  strip.appendChild(makeReelCard(result));
  const containerW = document.getElementById('reel-container').clientWidth;
  const targetX = -(N*cardW + cardW/2 - containerW/2);
  requestAnimationFrame(()=>{
    strip.style.transition = 'transform 2.4s cubic-bezier(.12,.7,.15,1)';
    strip.style.transform = `translateX(${targetX}px)`;
  });
  setTimeout(cb, 2500);
}
function makeReelCard(s){
  const c = document.createElement('div'); c.className='reel-card';
  c.style.borderColor = rarityColor(s.rarity);
  c.innerHTML = `<span class="e">${s.emoji}</span><span class="n">${s.name}</span>`;
  return c;
}

  document.getElementById('reveal-name').textContent = style.name;

  rEl.style.background = rarityColor(style.rarity)+'33'; rEl.style.color = rarityColor(style.rarity); rEl.style.border = '1px solid '+rarityColor(style.rarity);
  const already = (state.styles[style.id] && state.styles[style.id].timesObtained>1);
  document.getElementById('reveal-stats').innerHTML = `Probabilidad: 1 entre ${formatNum(style.prob)}<br>Monedas por pulsación: +${style.coins}🪙${already? '<br><i>(Ya lo tenías — obtenido de nuevo)</i>':''}`;

function renderInventory(){
  const grid = document.getElementById('inventory-grid');
  const search = document.getElementById('inv-search').value.toLowerCase();
  const sortBy = document.getElementById('inv-sort').value;
  const filterRarity = document.getElementById('inv-filter').value;
  const favOnly = document.getElementById('inv-fav-only').checked;
  let list = ownedStyleList().filter(s=>{
    if(search && !s.name.toLowerCase().includes(search)) return false;
    if(filterRarity!=='all' && s.rarity!==filterRarity) return false;
    if(favOnly && !state.favStyles.includes(s.id)) return false;
    return true;
  });
  list.sort((a,b)=>{
    if(sortBy==='name') return a.name.localeCompare(b.name);
    if(sortBy==='coins') return b.coins-a.coins;
    if(sortBy==='prob') return b.prob-a.prob;
    if(sortBy==='date') return (state.styles[b.id]?.firstObtainedAt||0)-(state.styles[a.id]?.firstObtainedAt||0);
    return RARITY_INDEX[b.rarity]-RARITY_INDEX[a.rarity];
  });
  grid.innerHTML='';
  if(list.length===0){ grid.innerHTML = '<div class="sub">Aún no tienes estilos. ¡Prueba la ruleta!</div>'; return; }
  list.forEach(s=>{
    const rec = state.styles[s.id];

    const isFav = state.favStyles.includes(s.id);

      <span class="fav-star">${isFav?'⭐':''}</span><span class="count-badge">x${rec?rec.timesObtained:1}</span>`;

        state.favStyles.push(s.id);
      }
      saveGame(); renderInventory();
    });
    grid.appendChild(card);
  });
}

    <div class="stat-row"><span>Monedas actuales</span><b>${formatNum(Math.floor(state.coins))}🪙</b></div>
    <div class="stat-row"><span>Monedas totales generadas</span><b>${formatNum(state.totalCoinsEarned)}🪙</b></div>
    <div class="stat-row"><span>Pulsaciones totales</span><b>${state.totalPresses}</b></div>
    <div class="stat-row"><span>Tecla más usada</span><b>${mostUsedKey()}</b></div>
    <div class="stat-row"><span>Estilo favorito</span><b>${favoriteStyleStat()}</b></div>
    <div class="stat-row"><span>Mayor rareza conseguida</span><b>${highestRarityOwned()}</b></div>
    <div class="stat-row"><span>Tiempo jugado</span><b>${formatTime(state.playTimeSeconds)}</b></div>
    <div class="stat-row"><span>Teclas desbloqueadas</span><b>${unlockedCount()} / ${ALL_CODES.length}</b></div>
    <div class="stat-row"><span>Estilos obtenidos</span><b>${ownedNonDefaultCount()} / ${STYLES.length}</b></div>
  `;
}

/* ============================= TABS ============================= */

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='inventory') renderInventory();
    if(btn.dataset.tab==='collection') renderCollection();
    if(btn.dataset.tab==='missions'||btn.dataset.tab==='achievements') refreshMissionsAchievements();
    if(btn.dataset.tab==='stats') refreshStats();
  });
});

/* ============================= GLOBAL REFRESH ============================= */

function refreshAll(){
  checkAchievements();
  ALL_CODES.forEach(code=>applyKeyVisual(keyElements[code], code));
  updateCoinDisplay();
  refreshShopAffordability();
  document.getElementById('roll-cost-label').textContent = `Coste de tirada: ${rollCost()}🪙`;
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab;
  if(activeTab==='inventory') renderInventory();
  if(activeTab==='collection') renderCollection();
  if(activeTab==='missions'||activeTab==='achievements') refreshMissionsAchievements();
  if(activeTab==='stats') refreshStats();
}

/* ============================= MUTE ============================= */
document.getElementById('mute-btn').addEventListener('click', ()=>{
  state.soundMuted = !state.soundMuted;
  document.getElementById('mute-btn').textContent = state.soundMuted ? '🔇' : '🔊';
  saveGame();
});

/* ============================= INIT ============================= */

function init(){
  state = loadGame();
  document.getElementById('mute-btn').textContent = state.soundMuted ? '🔇' : '🔊';
  applyBackground();
  buildKeyboard();
  renderRarityTable();
  renderShop();
  populateRarityFilters();
  renderInventory();
  renderCollection();
  renderMissions();
  renderAchievements();
  refreshStats();
  updateCoinDisplay();
  document.getElementById('roll-cost-label').textContent = `Coste de tirada: ${rollCost()}🪙`;

  setInterval(()=>{ state.playTimeSeconds++; }, 1000);
  setInterval(saveGame, 8000);
  window.addEventListener('beforeunload', saveGame);
  setInterval(()=>{ ALL_CODES.forEach(c=>{ if(!state.keys[c].unlocked) applyKeyVisual(keyElements[c], c); }); }, 2000);
}
init();

})();
</script>
</body>
</html>
